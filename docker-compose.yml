version: '3.8'

services:
  sub-merge-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sub-merge-converter
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      - PORT=8787
      - USERNAME=${USERNAME:-admin}
      - PASSWORD=${PASSWORD:-admin}
      - SUB_TOKEN=${SUB_TOKEN:-}
      - API_URL=${API_URL:-}
      - DATA_DIR=/app/data
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_KEY_PREFIX=sublink
      - CONFIG_TTL_SECONDS=2592000
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: sub-merge-converter-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

volumes:
  redis-data:
